# Agregado: con default-deny-all, PostgreSQL rechazaba todo el tráfico entrante y la app
# quedaba sin base de datos. Solo el backend y los clientes autorizados (Job/CronJob con
# role=db-client) pueden conectarse al puerto 5432.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database
  namespace: gponceb # Namespace del estudiante
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend-api
    - podSelector:
        matchLabels:
          role: db-client
    ports:
    - protocol: TCP
      port: 5432
---
# Salida para los Jobs de migración y backup: solo PostgreSQL y DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-clients
  namespace: gponceb # Namespace del estudiante
spec:
  podSelector:
    matchLabels:
      role: db-client
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
